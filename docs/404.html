<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>This shelf is empty · Liquid Assets</title>
<meta name="robots" content="noindex">
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #1d1410; color: #f3e9d8; font: 16px/1.5 system-ui, 'Segoe UI', sans-serif; text-align: center; padding: 16px; }
  .plank { height: 16px; width: min(320px, 80vw); margin: 0 auto 24px; border-radius: 3px; background: linear-gradient(#8a5a33, #6b4423 55%, #3e2614); box-shadow: 0 8px 14px rgba(0, 0, 0, .5); }
  h1 { font: 600 32px Georgia, serif; margin: 0 0 8px; }
  a { display: inline-block; margin-top: 8px; background: #c9a24a; color: #2a1d14; padding: 8px 16px; border-radius: 6px; font-weight: 600; text-decoration: none; }
</style>
</head>
<body>
  <main>
    <div class="plank" aria-hidden="true"></div>
    <h1>This shelf is empty</h1>
    <p>Nothing is standing here.</p>
    <a id="home" href="./">Back to the bar</a>
  </main>
<script>
  /* A mistyped path can be several folders deep. On a GitHub project site the first path segment is the repo name. */
  if (/\.github\.io$/.test(location.hostname)) {
    var first = location.pathname.split('/')[1];
    if (first) document.getElementById('home').href = '/' + first + '/';
  }
</script>
</body>
</html>
